name: documind-pqrs-oracle

services:
  postgres:
    image: postgres:16-alpine
    container_name: documind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pqrs_db
      POSTGRES_USER: pqrs_user
      POSTGRES_PASSWORD: pqrs_password
    volumes:
      - documind_pgdata:/var/lib/postgresql/data
      - ./database/init_db.sql:/docker-entrypoint-initdb.d/01_init_pqrs.sql:ro
      - ./database/documind_postgres_schema.sql:/docker-entrypoint-initdb.d/02_init_documind.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pqrs_user -d pqrs_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - documind_net

  backend:
    build:
      context: ./backend
    container_name: documind_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: pqrs_user
      DB_PASS: pqrs_password
      DB_PASSWORD: pqrs_password
      DB_NAME: pqrs_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Debe definir GEMINI_API_KEY en el archivo .env}
      JWT_SECRET: uts_clavedesarrollo_secreta_documind_2026
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - documind_net

  frontend:
    build:
      context: ./frontend
    container_name: documind_frontend
    restart: unless-stopped
    ports:
      - "8300:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - documind_net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: documind_tunnel
    restart: always
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend
    networks:
      - documind_net

networks:
  documind_net:
    driver: bridge

volumes:
  documind_pgdata:
    name: documind_pgdata
